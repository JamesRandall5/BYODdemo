<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TV Player</title>
  <link rel="icon" href="../images/icons/tabIcon.png">
  <!-- Video.js styles -->
  <link href="https://unpkg.com/video.js/dist/video-js.css" rel="stylesheet">
  <style>
    body,html{margin:0;padding:0;background:#000;color:#fff}
    .header{text-align:center;padding:10px}
    .logos img{height:40px;margin:0 10px}
    .container{text-align:center;margin:10px}
    #logo-container,#title-container{text-align:center;margin:10px}
    #video-container{position:relative;max-width:100%;margin:20px auto}
    .video-js{width:100%;height:auto;background:#000}
    .footer{text-align:center;padding:10px}
  </style>
</head>
<body>
  <div class="header">
    <div class="logos">
      <a href="https://www.nhs.uk/" target="_blank">
        <img src="../images/logos/left-logo.png" alt="Left Logo">
      </a>
      <a href="https://www.hospitaltv.co.uk/products/mycare-tv/" target="_blank">
        <img src="../images/logos/right-logo.png" alt="Right Logo">
      </a>
    </div>
  </div>

  <div class="container">
    <a href="../index.html" class="home-button">
      <img src="../images/icons/home.png" alt="Home" style="width:24px;vertical-align:middle">
      Home
    </a>
    <a href="#" onclick="history.back();return false;" class="ch-button">
      <img src="../images/icons/menu.png" alt="Menu" style="width:24px;vertical-align:middle">
      Ch. List
    </a>
  </div>

  <div id="logo-container"><img id="logo" src="" alt="Logo" style="max-width:200px"></div>
  <div id="title-container"><h1 id="title"></h1></div>

  <div id="video-container">
    <video
      id="video-player"
      class="video-js vjs-default-skin"
      controls
      autoplay
      muted
      preload="auto"
      data-setup='{}'>
    </video>
  </div>

  <div class="footer">
    <a href="https://www.hospitaltv.co.uk/" target="_blank">
      <img src="../images/logos/footer-image.png" alt="Footer" style="height:40px">
    </a>
  </div>

  <!-- Video.js + VHS -->
  <script src="https://unpkg.com/video.js/dist/video.js"></script>
  <script>
    (function(){
      const params    = new URLSearchParams(window.location.search);
      const streamUrl = params.get('url');
      const titleText = params.get('title');
      const logoUrl   = params.get('logo');

      if (titleText) document.getElementById('title').textContent = titleText;
      if (logoUrl)   document.getElementById('logo').src = logoUrl;

      const player = videojs('video-player', {
        html5: {
          hls: {
            overrideNative: true,
            // ensure mux.js caption parsing is active
            enableLowInitialPlaylist: true
          },
          nativeAudioTracks: false,
          nativeVideoTracks: false
        },
        liveui: true
      });

      player.ready(() => {
        player.src({ src: streamUrl, type: 'application/x-mpegURL' });
        // leave poster (logo) up until we get the first frame
        if (logoUrl) player.poster(logoUrl);

        player.one('loadedmetadata', () => {
          // first frame is ready, clear poster
          player.poster('');
        });

        player.play().catch(()=>{});
      });

      // fallback to native on fatal VHS errors
      player.on('error', () => {
        const err = player.error();
        console.error('VHS error:', err);
        if (videojs.browser.IS_SAFARI && player.canPlayType('application/vnd.apple.mpegurl')) {
          player.src({ src: streamUrl, type: 'application/vnd.apple.mpegurl' });
          player.play().catch(()=>{});
        }
      });
    })();
  </script>
</body>
</html>

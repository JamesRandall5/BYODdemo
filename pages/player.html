<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TV Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      padding: 10px;
      background: #111;
    }
    header img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      margin-right: 10px;
    }
    header h1 {
      font-size: 1.2rem;
      margin: 0;
    }
    #video {
      display: block;
      width: 100%;
      max-width: 800px;
      margin: 20px auto;
      background: #000;
    }
  </style>
</head>
<body>
  <header>
    <img id="logo" src="" alt="Channel Icon">
    <h1 id="title">Channel</h1>
  </header>

  <video id="video" controls autoplay muted></video>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const streamUrl = params.get('url');
      const title     = params.get('title') || 'Live Stream';
      const logoUrl   = params.get('logo')  || '';

      document.getElementById('title').textContent = title;
      if (logoUrl) {
        document.getElementById('logo').src = logoUrl;
      } else {
        document.getElementById('logo').style.display = 'none';
      }

      const video = document.getElementById('video');

      // Native HLS on Safari
      if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
      }
      // MSE-based HLS for other browsers
      else if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {});
        });
      }
      else {
        console.error('HLS not supported in this browser');
      }
    })();
  </script>
</body>
</html>

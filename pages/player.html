<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TV Player</title>
  <link href="https://unpkg.com/video.js/dist/video-js.css" rel="stylesheet">
  <style>
    body,html {margin:0;padding:0;background:#000;color:#fff;font-family:sans-serif}
    header {display:flex;align-items:center;padding:10px;background:#111}
    header img {width:32px;height:32px;object-fit:contain;margin-right:10px}
    header h1 {font-size:1.2rem;margin:0}
    #video-container {max-width:800px;margin:20px auto}
    .video-js {width:100% !important;height:auto !important;background:#000}
  </style>
</head>
<body>
  <header>
    <img id="logo" src="" alt="Logo">
    <h1 id="title">Channel</h1>
  </header>

  <div id="video-container">
    <video
      id="video-player"
      class="video-js vjs-default-skin"
      controls
      autoplay
      muted
      preload="auto"
      data-setup='{}'
    ></video>
  </div>

  <script src="https://unpkg.com/video.js/dist/video.js"></script>
  <script>
  (function(){
    const p      = new URLSearchParams(location.search);
    const url    = p.get('url');
    const title  = p.get('title') || 'Live Stream';
    const logo   = p.get('logo')  || '';
    const player = videojs('video-player', {
      html5: {
        vhs: { overrideNative: true },
        nativeAudioTracks: false,
        nativeVideoTracks: false
      },
      liveui: true
    });

    // header
    document.getElementById('title').textContent = title;
    if (logo) document.getElementById('logo').src = logo;

    player.ready(() => {
      player.src({ src: url, type: 'application/x-mpegURL' });
      player.play().catch(()=>{});
    });

    // error logging
    player.on('error', () => {
      const e = player.error();
      console.error('Video.js/VHS error:', e.code, e.message);
    });
  })();
  </script>
</body>
</html>

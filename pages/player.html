<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TV Player</title>

  <!-- Video.js CSS -->
  <link href="https://unpkg.com/video.js/dist/video-js.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      padding: 10px;
      background: #111;
    }
    header img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      margin-right: 10px;
    }
    header h1 {
      font-size: 1.2rem;
      margin: 0;
    }
    #video-container {
      max-width: 800px;
      margin: 20px auto;
    }
    .video-js {
      width: 100% !important;
      height: auto !important;
      background: #000;
    }
  </style>
</head>
<body>

  <header>
    <img id="logo" src="" alt="Channel Icon">
    <h1 id="title">Live Stream</h1>
  </header>

  <div id="video-container">
    <video
      id="video-player"
      class="video-js vjs-default-skin"
      controls
      autoplay
      muted
      preload="auto"
      data-setup='{}'
    ></video>
  </div>

  <!-- Video.js core (includes VHS/mux.js) -->
  <script src="https://unpkg.com/video.js/dist/video.js"></script>
  <script>
    (function() {
      // Read URL params: url, title, logo
      const params    = new URLSearchParams(window.location.search);
      const streamUrl = params.get('url');
      const titleText = params.get('title') || 'Live Stream';
      const logoUrl   = params.get('logo')  || '';

      // Populate header
      document.getElementById('title').textContent = titleText;
      if (logoUrl) {
        document.getElementById('logo').src = logoUrl;
      } else {
        document.getElementById('logo').style.display = 'none';
      }

      // Initialize Video.js player with VHS enabled
      const player = videojs('video-player', {
        html5: {
          vhs: { overrideNative: true },
          nativeAudioTracks: false,
          nativeVideoTracks: false
        },
        liveui: true,
        autoplay: true,
        muted: true
      });

      player.ready(() => {
        player.src({ src: streamUrl, type: 'application/x-mpegURL' });
        player.play().catch(() => {});
      });

      // On fatal VHS errors, log and leave UI
      player.on('error', () => {
        console.error('Video.js error code', player.error().code, player.error().message);
      });
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Player</title>
  <link rel="icon" type="image/png" href="../images/icons/tabIcon.png">
  <link rel="stylesheet" href="../styles.css">
  <!-- Created by James Randall for Airwave Europe Ltd. -->
  <style>
    #player {
      width: calc(100% - 20px);
      height: calc(100% - 20px);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logos">
      <a href="https://www.nhs.uk/" target="_blank">
        <img src="../images/logos/left-logo.png" alt="Left Logo" class="logo-left">
      </a>
      <a href="https://www.hospitaltv.co.uk/products/mycare-tv/" target="_blank">
        <img src="../images/logos/right-logo.png" alt="Right Logo" class="logo-right">
      </a>
    </div>
  </div>

  <div class="container" id="button-container">
    <a href="../index.html" class="home-button">
      <div class="home-button-content">
        <img src="../images/icons/home.png" alt="Home Icon" class="home-button-icon">
        <span class="home-button-text">Home</span>
      </div>
    </a>
    <a href="#" onclick="history.back(); return false;" class="ch-button">
      <div class="ch-button-content">
        <img src="../images/icons/menu.png" alt="Menu Icon" class="ch-button-icon">
        <span class="home-button-text">Ch. List</span>
      </div>
    </a>
  </div>

  <br>

  <div id="logo-container" style="text-align: center; margin-top: 20px;">
    <img id="logo" src="" alt="Logo" style="max-width: 200px;">
  </div>
  <div id="title-container" style="text-align: center; margin-top: 10px;">
    <h1 id="title"></h1>
  </div>

  <br><br>

  <div id="video-container" style="text-align: center; margin-top: 20px;">
    <video id="video-player" controls style="max-width: 100%;">
      Your browser does not support the video tag.
    </video>
  </div>

  <!-- Include hls.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    function getQueryParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        url:    params.get('url'),
        title:  params.get('title'),
        logo:   params.get('logo')
      };
    }

    function isSafari() {
      return /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
    }

    function isMobile() {
      return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    }

    function setupHls(video, url) {
      const hls = new Hls({
        // keep up to 5 minutes of buffer ahead
        maxBufferLength:            300,
        // never drop segments until 5 minutes behind
        backBufferLength:           300,
        // tolerate up to 1s gap before stalling
        maxBufferHole:              1.0,
        // stay ~10 segments behind live edge
        liveSyncDurationCount:      10,
        // allow up to ~20 segments latency
        liveMaxLatencyDurationCount: 20,
        // manifest retry settings
        manifestLoadingMaxRetry:    6,
        manifestLoadingRetryDelay:  1000,
        manifestLoadingTimeOut:     10000,
        // disable caching of playlists
        xhrSetup: (xhr) => {
          xhr.setRequestHeader('Cache-Control', 'no-cache');
          xhr.setRequestHeader('Pragma', 'no-cache');
        }
      });

      // cache-buster on each playlist fetch
      hls.on(Hls.Events.MANIFEST_LOADING, (_, data) => {
        const base = data.url.split('?')[0];
        data.url = base + '?r=' + Date.now();
      });

      hls.attachMedia(video);

      hls.on(Hls.Events.MEDIA_ATTACHED, () => {
        hls.loadSource(url);
      });

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        hls.nextLevel = 0; // start lowest quality to build buffer quickly
        video.play().catch(e => console.error('Play error:', e));
      });

      hls.on(Hls.Events.ERROR, (_, data) => {
        console.error('HLS error:', data);
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
          console.warn('Network error – restarting load');
          hls.startLoad();
        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
          console.warn('Media error – attempting recovery');
          hls.recoverMediaError();
        } else if (data.fatal) {
          console.error('Fatal error – destroying hls instance');
          hls.destroy();
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const { url, title, logo } = getQueryParams();
      const video = document.getElementById('video-player');

      if (title) document.getElementById('title').innerText = title;
      if (logo)  document.getElementById('logo').src = logo;

      if (isSafari() || isMobile()) {
        // Native HLS in Safari/mobile
        video.src = url;
        video.addEventListener('loadedmetadata', () => video.play());
      } else if (Hls.isSupported()) {
        // MSE-based HLS with hls.js
        setupHls(video, url);
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Fallback native HLS
        video.src = url;
        video.addEventListener('loadedmetadata', () => video.play());
      } else {
        console.error('This browser does not support HLS.');
      }
    });
  </script>

  <br><br><br><br>

  <div class="footer">
    <a href="https://www.hospitaltv.co.uk/" target="_blank">
      <img class="footer-image1" src="../images/logos/footer-image.png" alt="Footer Image">
    </a>
  </div>
</body>
</html>

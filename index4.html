<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radix Test</title>
    <link rel="icon" type="image/png" href="images/icons/tabIcon.png">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Custom Console Panel */
        #custom-console {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            background: black;
            color: white;
            font-family: monospace;
            overflow-y: auto;
            padding: 10px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.2);
        }
        #console-input {
            width: 100%;
            background: #222;
            color: white;
            border: none;
            padding: 5px;
            font-size: 14px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logos">
            <a href="https://www.nhs.uk/" target="_blank">
                <img src="images/logos/left-logo.png" alt="Left Logo" class="logo-left">
            </a>
            <a href="https://www.hospitaltv.co.uk/products/mycare-tv/" target="_blank">
                <img src="images/logos/right-logo.png" alt="Right Logo" class="logo-right">
            </a>     
        </div>
    </div>

    <div class="container" id="button-container">
        <!-- Button 1: Volume Up -->
        <a class="button" onclick="runCommand('volumeUp')">
            <div class="button-content">
                <div class="button-text">
                    <span class="title">Volume Up</span>
                </div>
                <div class="button-icon">
                    <img src="images/icons/tv.png" alt="Icon">
                </div>
            </div>
        </a>

        <!-- Button 2: Volume Down -->
        <a class="button" onclick="runCommand('volumeDown')">
            <div class="button-content">
                <div class="button-text">
                    <span class="title">Volume Down</span>
                </div>
                <div class="button-icon">
                    <img src="images/icons/subs.png" alt="Icon">
                </div>
            </div>
        </a>

        <!-- Button 3: Launch YouTube -->
        <a class="button" onclick="runCommand('launchYouTube')">
            <div class="button-content">
                <div class="button-text">
                    <span class="title">Launch YT</span>
                </div>
                <div class="button-icon">
                    <img src="images/icons/subs.png" alt="Icon">
                </div>
            </div>
        </a>
    </div>

    <!-- Custom Console Panel -->
    <div id="custom-console">
        <div id="console-output"></div>
        <input type="text" id="console-input" placeholder="Type command and press Enter...">
    </div>

    <script>
        function logToConsole(message, type = 'log') {
            const consoleOutput = document.getElementById("console-output");
            let newMessage = document.createElement("div");
            newMessage.style.color = type === 'error' ? 'red' : 'white';
            newMessage.textContent = message;
            consoleOutput.appendChild(newMessage);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }

        // Capture console logs
        (function() {
            let oldLog = console.log;
            console.log = function(message) {
                oldLog.apply(console, arguments);
                logToConsole("[LOG] " + message);
            };

            let oldError = console.error;
            console.error = function(message) {
                oldError.apply(console, arguments);
                logToConsole("[ERROR] " + message, 'error');
            };
        })();

        // Handle input in console panel
        document.getElementById("console-input").addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                let command = event.target.value.trim();
                event.target.value = "";
                try {
                    let result = eval(command);
                    console.log("[EVAL] " + result);
                } catch (error) {
                    console.error("[EVAL ERROR] " + error);
                }
            }
        });

        function runCommand(command) {
            if (command === "volumeUp") {
                radix.doCommand(JSON.stringify({
                    "command": {
                        "@class": "com.viso.entities.commands.CommandRemoteExec",
                        "remoteExecItem": {
                            "@class": "com.viso.entities.RemoteExecItem",
                            "command": "!internal",
                            "args": ["input_keyevent", "10", "0", "24"],
                            "authority": "AUTHORITY_SYSTEM",
                            "waitForExit": true,
                            "collectOutput": true,
                            "repositoryItemName": "Volume Up"
                        }
                    }
                }));
                console.log("✅ Volume Up Command Sent");
            } else if (command === "volumeDown") {
                radix.doCommand(JSON.stringify({
                    "command": {
                        "@class": "com.viso.entities.commands.CommandRemoteExec",
                        "remoteExecItem": {
                            "@class": "com.viso.entities.RemoteExecItem",
                            "command": "!internal",
                            "args": ["input_keyevent", "10", "0", "25"],
                            "authority": "AUTHORITY_SYSTEM",
                            "waitForExit": true,
                            "collectOutput": true,
                            "repositoryItemName": "Volume Down"
                        }
                    }
                }));
                console.log("✅ Volume Down Command Sent");
            } else if (command === "launchYouTube") {
                radix.doCommand(JSON.stringify({
                    "command": {
                        "@class": "com.viso.entities.commands.CommandRemoteExec",
                        "remoteExecItem": {
                            "@class": "com.viso.entities.RemoteExecItem",
                            "repositoryItemName": "Start App",
                            "isReadOnly": false,
                            "privateRepoItem": false,
                            "command": "monkey",
                            "args": ["-p", "com.google.android.youtube", "1"],
                            "authority": "AUTHORITY_SYSTEM",
                            "waitForExit": true,
                            "collectOutput": true,
                            "props": {
                                "args": "-p com.google.android.youtube -c android.intent.category.LAUNCHER 1 || monkey -p com.google.android.youtube -c android.intent.category.LEANBACK_LAUNCHER 1",
                                "usedCommandStart": true,
                                "package": "com.google.android.youtube"
                            }
                        }
                    }
                }));
                console.log("✅ YouTube Launch Command Sent");
            } else {
                console.error("❌ Unknown Command: " + command);
            }
        }
    </script>
</body>
</html>
